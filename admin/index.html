<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>객실 통합 관리 시스템</title>
<meta name="description" content="한화리조트 해운대 객실관리 · 관리자 전용 (오늘 현황 · 배정 · 더티 배분 · VOC · 명단)">
<meta name="theme-color" content="#10233F">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="객실 통합 관리 시스템">
<meta property="og:description" content="한화리조트 해운대 객실관리 · 관리자 전용 (오늘 현황 · 배정 · 더티 배분 · VOC · 명단)">

<meta property="og:image:width" content="1200">

<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="객실통합관리">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#111827; --muted:#4B5563; --line:#E5E8EE; --tile:#F2F5FA;
  --navy:#10233F; --brand:#1D3A6E; --gold:#C79A3B; --ok:#1E8E3E; --ok-soft:#E8F5EC; --warn:#B23A48; --warn-soft:#FDEDEF;
  --wait:#8A5A00; --wait-soft:#FDF3DC; --shadow:0 2px 10px rgba(17,24,39,.06);
  --warn-red:#B42318; --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.45}
button{font-family:inherit}
.top{position:relative;background:#0E1E36;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 15px}
.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold),#E8C77A 50%,var(--gold))}
.top-in{max-width:760px;margin:0 auto}
.top-row{display:flex;align-items:center;gap:12px}
.top .cal{width:54px;height:58px;border-radius:13px;background:linear-gradient(180deg,#fff,#EEF2F8);color:var(--navy);text-align:center;flex:none;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.top .cal i{display:block;font-style:normal;background:var(--gold);color:#fff;font-weight:800;font-size:10.5px;line-height:17px;white-space:nowrap}
.top .cal b{display:block;font-family:var(--f-num);font-weight:600;font-size:25px;line-height:40px;font-variant-numeric:tabular-nums}
.top .tt{flex:1;min-width:0}
.top h1{margin:0;font-size:19px;font-weight:900;letter-spacing:-.4px;line-height:1.25;word-break:keep-all}
.top .sub{font-size:12.5px;opacity:.72;margin-top:3px}
.top .ring{flex:none;width:56px;height:56px;position:relative}
.top .ring svg{display:block}
.top .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:600;font-size:14px;color:#E8C77A;font-variant-numeric:tabular-nums}
.top .line{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:12.5px;opacity:.9}
.top .line:empty{display:none}
.top .line b{font-family:var(--f-num);color:#fff;font-size:14px;margin-left:4px}
.top .line .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3DDC84;margin-right:6px;box-shadow:0 0 0 3px rgba(61,220,132,.18);vertical-align:1px}
.top .line .dot.bad{background:#F26B7A;box-shadow:0 0 0 3px rgba(242,107,122,.2)}.top .line .dot.wait{background:#F2B544;box-shadow:0 0 0 3px rgba(242,181,68,.2)}
main{max-width:760px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--surface);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-size:12.5px;font-weight:500;color:var(--muted)}
.ref{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:700 13px inherit;cursor:pointer;white-space:nowrap}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.pill{border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--warn-soft);color:var(--warn)}.pill.wait{background:var(--wait-soft);color:var(--wait)}
.st{list-style:none;margin:0;padding:0}
.st li{display:grid;grid-template-columns:26px 1fr;gap:6px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.st li:first-child{border-top:0}
.st li b{display:block;font-size:15px}
.st li span{color:var(--muted);font-size:13px}
.st li.bad b{color:var(--warn)}.st li.wait b{color:var(--wait)}
.prog{margin:2px 0 4px}
.prog .big{font-size:30px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.prog .big small{font-size:15px;font-weight:700;color:var(--muted);margin-left:6px}
.bar{height:14px;border-radius:99px;background:var(--tile);overflow:hidden;margin:8px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#3B6FB6);border-radius:99px;transition:width .4s}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--tile);border-radius:12px;padding:9px 10px}
.kv b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kv span{font-size:12.5px;color:var(--muted)}
.go-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--tile);border:1.5px solid var(--line);border-radius:16px;padding:14px 14px 12px;min-height:96px}
.go .ic{font-size:22px}
.go b{font-size:15.5px}
.go span{font-size:12.5px;color:var(--muted);line-height:1.35}
.go:active{transform:scale(.98)}
.big-btn{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--brand);color:#fff;font:800 16px inherit;cursor:pointer}
.big-btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.login .seg{display:flex;gap:8px;margin:0 0 10px}
.login .seg button{flex:1;min-height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font:700 16px inherit;cursor:pointer;color:var(--ink)}
.login .seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.login input{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:17px inherit;margin:0 0 10px}
.err{color:var(--warn);font-weight:700;font-size:14px;margin:0 0 10px}
.foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:18px}
.foot button{border:0;background:none;color:var(--brand);text-decoration:underline;font:700 13px inherit;cursor:pointer}
.seg2{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg2 button{flex:1;min-height:46px;border:0;background:transparent;color:var(--ink);font:700 15px inherit;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--brand);color:#fff}
.upsum{margin:12px 0 4px;font-size:15px;line-height:1.55}.upsum p{margin:4px 0}
.upchk{list-style:none;margin:6px 0;padding:0;font-size:14px}.upchk li{padding:2px 0}.upchk li.no{color:var(--warn);font-weight:700}
.upsum details{margin-top:6px;font-size:14px}.upsum summary{cursor:pointer;color:var(--muted)}
.warnbox{background:var(--warn-soft);border:1.5px solid var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14.5px;line-height:1.5}.warnbox b{color:var(--warn)}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px;font-weight:700;margin:0 0 10px}
.waitbox{background:var(--wait-soft);color:var(--wait);border-radius:12px;padding:12px;font-weight:700;margin:0}
#upcard{scroll-margin-top:84px}
.btn2{display:flex;gap:8px;margin-top:12px}.btn2 .big-btn{flex:1}
.big-btn.danger{background:var(--warn)}.big-btn[disabled]{opacity:.5}
.linkbtn{display:flex;align-items:center;justify-content:center;text-decoration:none}

.act-bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--navy);color:#fff}
.act-bar b{font-size:16px}.act-bar span{flex:1;font-size:12.5px;opacity:.8}.act-bar .vp-x{background:rgba(255,255,255,.15);color:#fff}
#actf{display:block;width:100%;height:calc(100% - 60px - env(safe-area-inset-top));border:0;background:var(--bg)}
/* 자동 배정 (2026-11-13) */
.asg-rows{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.asg-r{display:flex;align-items:center;justify-content:space-between;gap:4px;border:1.5px solid var(--line);border-radius:12px;padding:4px 4px 4px 8px;background:var(--surface)}
.asg-r.off{opacity:.55}.asg-r>button{border:0;background:none;font:700 14px inherit;color:var(--ink);text-align:left;cursor:pointer;padding:6px 0;display:flex;flex-direction:column;white-space:nowrap;min-width:0}
@media (max-width:420px){.asg-rows{grid-template-columns:1fr}}
.asg-prev{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin-top:12px;font-weight:700;font-size:14px}.asg-prev input{min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font:16px inherit;width:100%;box-sizing:border-box}
.asg-r>button small{font-size:11px;color:var(--muted);font-weight:600}
.asg-u{display:flex;align-items:center;gap:2px}.asg-u button{width:30px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--tile);font:800 16px inherit;cursor:pointer;color:var(--ink)}
.asg-u b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.asg-list{display:flex;flex-direction:column}
.asg-m{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:9px 2px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.asg-m:first-child{border-top:0}.asg-m.hot .f{color:var(--warn);font-weight:700}
.asg-m .n small{color:var(--muted);font-size:12px}.asg-m .f{text-align:right;font-size:14px;font-variant-numeric:tabular-nums}.asg-m .f small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.asg-why{font-size:13px;background:var(--tile);border-radius:10px;padding:8px 10px;margin:0 0 6px;line-height:1.55;word-break:keep-all}
.asg-why small{color:var(--muted)}
.asg-chips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 6px}
.asg-chip{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 7px;font:700 13px var(--f-num);cursor:pointer;color:var(--ink)}
.asg-chip.on{background:var(--brand);border-color:var(--brand);color:#fff}.asg-chip.bad{border-color:var(--warn);color:var(--warn)}
.asg-mv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;font-size:14px}
.asg-mv select{flex:1 1 100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;font:15px inherit;padding:0 8px;background:var(--surface);color:var(--ink)}
.asg-mv .big-btn{flex:1;min-height:44px}
.cf-grid{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px;align-items:center}.cf-grid b{font-size:13px;color:var(--muted)}
.cf-grid input,.cf-q input{width:100%;box-sizing:border-box;min-height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;font:15px inherit;background:var(--surface);color:var(--ink)}
.cf-f{font-weight:800;font-variant-numeric:tabular-nums}.cf-w{display:inline-block;font-size:11px;color:var(--wait);font-weight:700}
.cf-q{display:grid;grid-template-columns:1fr 80px 40px;gap:6px;align-items:center;margin:0 0 6px}.cf-q .vp-x{width:40px;height:40px}
/* VOC 화면 (2026-11-13, 정비 레포트 voc.js 를 허브에서 그대로 씀) — 정비 레포트 style.css 에서 VOC 부분만 옮김 */
.vp{position:fixed;inset:0;z-index:55;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.vp-in{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 120px}
.vp-head{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}.vp-head h2{margin:0;font-size:20px}
.vp-x{width:44px;height:44px;border:0;border-radius:12px;background:var(--tile);color:var(--ink);font-size:18px;cursor:pointer}
.vp-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:var(--navy);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;max-width:90vw}
#vocin .card h3{margin:0 0 8px;font-size:16px;font-weight:900}
#vocin .rec{font-size:14px;color:var(--muted)}
#vocin .acts{display:flex;gap:8px}
#vocin .acts button{flex:1;min-height:50px;border-radius:12px;font:700 15px var(--f-body);cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#vocin .acts .go{background:var(--navy);color:#fff;border-color:var(--navy)}
#vocin .acts .go:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:default}
#vocin .acts button:disabled{opacity:.45;cursor:default}
#vocin .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
#vocin .kpi{background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
#vocin .kpi b{display:block;font:800 24px var(--f-num)}
#vocin .kpi span{font-size:12px;color:var(--muted)}
#vocin .kpi:nth-child(1){background:var(--navy);color:#fff} #vocin .kpi:nth-child(1) span{color:rgba(255,255,255,.85)}
#vocin .kpi:nth-child(2) b{color:var(--warn-red)}
#vocin .list{display:flex;flex-direction:column}
#vocin .list .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
#vocin .list .r:first-child{border-top:0}
#vocin .list .r span:last-child{color:var(--muted);text-align:right}
#vocin .sec{color:var(--muted);font-weight:700;margin:6px 4px 8px}
.vtxt{width:100%;box-sizing:border-box;font:500 15px/1.5 var(--f-body);padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.vitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;box-shadow:inset 4px 0 0 var(--warn-red)}
.vitem.good{box-shadow:inset 4px 0 0 #1f8a4c}
.vtop{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.vk{font:800 12px var(--f-body);color:#fff;background:var(--warn-red);border-radius:6px;padding:3px 7px}
.vitem.good .vk{background:#1f8a4c}
.vcat{font:700 12px var(--f-body);color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent);border-radius:6px;padding:3px 7px}
.vroom{font:700 18px var(--f-num);color:var(--ink)}
.vdate{margin-left:auto;font-size:12px;color:var(--muted)}
.vtext{margin:8px 0;font-size:15px;line-height:1.5}
.vresp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.vchip{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 11px;font:700 13px var(--f-body);cursor:pointer}
.vchip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.vtypes{font-size:12px;color:var(--muted)}
.vwho{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--navy) 6%,var(--surface))}
.vwho small{color:var(--muted)}
.vwarn{color:var(--warn-red);font-weight:700}
.vacts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.vacts button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;font:700 13px var(--f-body);cursor:pointer}
.vacts button.dangerl{color:var(--warn-red)}
.vtabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}
.vtabs>button[data-vtab]{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 12px;font:800 14px var(--f-body);cursor:pointer}
.vtabs>button[data-vtab][aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.vper{display:flex;align-items:center;gap:6px;margin-left:auto}
.vper button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;font:700 16px var(--f-body);cursor:pointer;color:var(--ink)}
.vcsv{border:1.5px solid #1f8a4c;color:#1f8a4c;background:var(--surface);border-radius:99px;padding:6px 12px;font:800 13px var(--f-body);cursor:pointer}
.kpis .kpi.vgood b{color:#1f8a4c}

@media (max-width:360px){.go-grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="top-row"><div class="cal" aria-hidden="true"><i id="calm"></i><b id="cald"></b></div><div class="tt"><h1>객실 통합 관리 시스템</h1><div class="sub" id="today">한화리조트 해운대</div></div><div class="ring" id="ring" hidden></div></div><div class="line" id="hline"></div></div></header>
<main id="main"><div class="card"><p class="note" style="margin:0">여는 중…</p></div></main>
<noscript><div class="card">이 화면은 자바스크립트가 켜져 있어야 해요.</div></noscript>
<script type="module" src="hub.js?v=2026.11.13-9"></script>

</body>
