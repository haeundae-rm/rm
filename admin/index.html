<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>객실 통합 관리 시스템 — 새 주소로 이동</title>
<meta property="og:title" content="객실 통합 관리 시스템">
<meta property="og:description" content="새 주소: haeundae-rm.github.io/hub/">
<meta property="og:image" content="https://haeundae-rm.github.io/hub/og.png?v=1">
<link rel="icon" href="icon-192.png">
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0E1E36;color:#fff;display:grid;place-items:center;min-height:100vh;text-align:center}a{color:#E8C873;font-size:18px}</style>
</head>
<body>
<div>
<p>객실 통합 관리 시스템 주소가 바뀌었어요.<br>잠시 후 새 주소로 넘어가요.</p>
<p><a id="go" href="../../hub/">새 주소로 가기 → haeundae-rm.github.io/hub/</a></p>
<p style="opacity:.7;font-size:13px">홈 화면에 예전 아이콘이 있으면 지우고<br>새 주소에서 다시 추가해 주세요.</p>
</div>
<script>
// 2026-11-13: 허브를 정비 레포트(/rm/) 범위 밖 /hub/ 로 옮김 — 예전 주소는 안내 후 이동, 예전 서비스 워커는 정리
(function () {
  var to = new URL('../../hub/', location.href).href + location.search + location.hash;
  document.getElementById('go').href = to;
  var go = function () { location.replace(to); };
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { if (/\/rm\/admin\/$/.test(new URL(r.scope).pathname)) r.unregister(); });
      }).catch(function () {}).then(function () { setTimeout(go, 600); });
      return;
    }
  } catch (e) {}
  setTimeout(go, 600);
})();
</script>
</body>
</html>
